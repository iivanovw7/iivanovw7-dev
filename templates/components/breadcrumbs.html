<div class="breadcrumbs">
    {% for crumb in breadcrumbs.crumbs %}
    <!-- prettier-ignore -->
    {% set text = crumb.label %}
    {% set href = crumb.path %}
    {% include "ui-kit/link.html" %}
    <span class="breadcrumbs__separator" role="separator" aria-orientation="vertical"></span>
    {% endfor %}
    <span class="breadcrumbs__leaf">{{ breadcrumbs.leaf }}</span>
</div>
