<div id="post-content" class="pages-post-content">{{ post.content | safe }}</div>
<script>
	(() => {
		window.addEventListener('load', () => {
			let content = document.getElementById("post-content")

			if (content && hljs) {
				let preElements = content.getElementsByTagName("pre") || [];

				for (let preElement of preElements) {
					let codeElement = preElement.querySelector("code");

					if (codeElement) {
						hljs.highlightElement(codeElement);
					}
				}
			}
		});
	})();
</script>
